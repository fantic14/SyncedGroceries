#:schema https://supabase.com/schemas/config/v1.json
# Local CLI configuration. db push deploys migrations, not these Auth/API settings.
# Configure hosted Auth, SMTP, and Data API settings in the Supabase dashboard.
project_id = "synced-groceries"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Match the hosted project's major version before running an optional local stack.
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://127.0.0.1:8081"
additional_redirect_urls = []
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enabled = true
enable_confirmations = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 3600

[auth.email.template.magic_link]
subject = "Your Synced Groceries sign-in code"
content_path = "./templates/magic-link.html"

[auth.email.template.confirmation]
subject = "Your Synced Groceries sign-in code"
content_path = "./templates/magic-link.html"
